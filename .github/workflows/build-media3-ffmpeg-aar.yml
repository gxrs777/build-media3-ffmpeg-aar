name: build-media3-ffmpeg-aar

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  MEDIA3_TAG: 1.11.1
  NDK_VERSION: 28.2.13676358          # 改成项目要求的版本
  HOST: linux-x86_64
  ANDROID_API: 24
  DECODERS: "aac aac_latm mp2 mp3 ac3 eac3 flac opus pcm_s16le pcm_alaw pcm_mulaw"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Media3
        uses: actions/checkout@v4
        with:
          repository: androidx/media
          ref: ${{ env.MEDIA3_TAG }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept licenses and install NDK + CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${{ env.NDK_VERSION }}" "cmake;3.22.1"

      - name: Configure local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> local.properties
          cat local.properties

      - name: Clone FFmpeg source
        run: |
          set -e
          JNI="libraries/decoder_ffmpeg/src/main/jni"
          mkdir -p "$JNI"
          if [ ! -d "$JNI/ffmpeg/.git" ]; then
            git clone --depth 1 --branch release/6.0 https://git.ffmpeg.org/ffmpeg.git "$JNI/ffmpeg"
          fi
          test -f "$JNI/ffmpeg/configure"

      - name: Build ffmpeg static libs
        run: |
          set -e
          JNI="libraries/decoder_ffmpeg/src/main/jni"
          NDK="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          FFMPEG_MODULE_PATH="libraries/decoder_ffmpeg/src/main"
          bash "$JNI/build_ffmpeg.sh" \
            "$FFMPEG_MODULE_PATH" "$NDK" "${{ env.HOST }}" "${{ env.ANDROID_API }}" ${{ env.DECODERS }}
          echo "==== 静态库检查 ===="
          find "$JNI/ffmpeg/android-libs" -name "libavcodec.a" | sort

      - name: Build AAR
        run: |
          chmod +x gradlew
          ./gradlew :lib-decoder-ffmpeg:clean :lib-decoder-ffmpeg:assembleRelease \
            -Pandroid.injected.build.abi=armeabi-v7a,arm64-v8a \
            --no-daemon

      - name: Verify AAR contains native libs
        run: |
          set -e
          SRC=$(find libraries/decoder_ffmpeg -path '*/outputs/aar/*release.aar' 2>/dev/null | head -1)
          echo "AAR path: $SRC"
          test -n "$SRC"
          echo "==== AAR 内 so 列表 ===="
          unzip -l "$SRC" | grep 'libffmpegJNI.so'
          if unzip -l "$SRC" | grep -q 'libffmpegJNI.so'; then
            echo "OK: Native lib found"
          else
            echo "ERROR: Native lib missing in AAR"
            exit 1
          fi
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Rename and Upload AAR
        run: |
          DST="media3-decoder-ffmpeg-${{ env.MEDIA3_TAG }}.aar"
          cp "$SRC" "$DST"
          ls -lh "$DST"
          echo "AAR=$DST" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: media3-ffmpeg-aar
          path: ${{ env.AAR }}
