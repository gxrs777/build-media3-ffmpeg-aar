name: Build Media3 Ffmpeg AAR

on:
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NDK_VERSION: '25.2.9519653'
  HOST: 'linux-x86_64'
  API_LEVEL: '24'
  FFMPEG_REF: 'release/6.0'
  MEDIA3_TAG: '1.11.1'
  DECODERS: 'aac aac_latm mp2 mp3 ac3 eac3 flac opus pcm_s16le pcm_alaw pcm_mulaw'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Media3 source
        uses: actions/checkout@v4
        with:
          repository: androidx/media
          ref: ${{ env.MEDIA3_TAG }}
          path: media3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;${{ env.NDK_VERSION }}" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Write local.properties
        working-directory: media3
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties

      - name: Clone FFmpeg source
        working-directory: media3/libraries/decoder_ffmpeg/src/main/jni
        run: |
          if [ ! -d ffmpeg/.git ]; then
            git clone --depth 1 --branch ${{ env.FFMPEG_REF }} https://github.com/FFmpeg/FFmpeg.git ffmpeg
          fi
          ls ffmpeg/configure

      - name: Patch build_ffmpeg.sh (remove obsolete --disable-avresample)
        working-directory: media3/libraries/decoder_ffmpeg/src/main/jni
        run: |
          # FFmpeg 6.0 已移除 avresample，直接删除该选项
          sed -i '/--disable-avresample/d' build_ffmpeg.sh
          echo "检查是否还存在 avresample:"
          grep avresample build_ffmpeg.sh || echo "已移除"

      - name: Build FFmpeg static libs
        working-directory: media3/libraries/decoder_ffmpeg/src/main/jni
        run: |
          set -e
          MODULE=".."
          NDK="$ANDROID_NDK_HOME"
          bash build_ffmpeg.sh "$MODULE" "$NDK" "${{ env.HOST }}" "${{ env.API_LEVEL }}" ${{ env.DECODERS }}
          echo "---- Check static libs ----"
          find ffmpeg/android-libs -name 'libavcodec.a' -print

      - name: Patch build.gradle.kts to add abiFilters and ndkVersion
        working-directory: media3/libraries/decoder_ffmpeg
        run: |
          python3 - <<'EOF'
          path = "build.gradle.kts"
          with open(path) as f:
              content = f.read()

          if "abiFilters" not in content:
              marker = "android {"
              insert = '''
            ndkVersion = "25.2.9519653"
            defaultConfig {
              ndk {
                abiFilters += listOf("armeabi-v7a", "arm64-v8a")
              }
            }'''
              content = content.replace(marker, marker + insert, 1)

          with open(path, "w") as f:
              f.write(content)
          print("Patched build.gradle.kts")
          EOF
          grep -n "abiFilters\|ndkVersion" build.gradle.kts

      - name: Make gradlew executable
        working-directory: media3
        run: chmod +x gradlew

      - name: Resolve FFmpeg Gradle module name
        id: module
        working-directory: media3
        run: |
          echo "Listing available projects..."
          ./gradlew projects --no-daemon || true
          
          if ./gradlew :lib-decoder-ffmpeg:tasks -q --no-daemon >/dev/null 2>&1; then
            echo "module=lib-decoder-ffmpeg" >> "$GITHUB_OUTPUT"
          elif ./gradlew :decoder-ffmpeg:tasks -q --no-daemon >/dev/null 2>&1; then
            echo "module=decoder-ffmpeg" >> "$GITHUB_OUTPUT"
          elif ./gradlew :media3-decoder-ffmpeg:tasks -q --no-daemon >/dev/null 2>&1; then
            echo "module=media3-decoder-ffmpeg" >> "$GITHUB_OUTPUT"
          else
            echo "No valid module found" >&2
            exit 1
          fi

      - name: Build AAR
        working-directory: media3
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          ./gradlew :${{ steps.module.outputs.module }}:assembleRelease --no-daemon

      - name: Locate and rename AAR
        working-directory: media3
        id: artifact
        run: |
          AAR=$(find libraries/decoder_ffmpeg -path '*/outputs/aar/*release.aar' -type f | head -1)
          if [ -z "$AAR" ]; then
            echo "AAR not found"
            find libraries -name '*.aar' -print
            exit 1
          fi
          DST="media3-decoder-ffmpeg-${{ env.MEDIA3_TAG }}.aar"
          cp "$AAR" "$DST"
          echo "aar_path=$DST" >> "$GITHUB_OUTPUT"

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: media3-ffmpeg-aar
          path: media3/${{ steps.artifact.outputs.aar_path }}
