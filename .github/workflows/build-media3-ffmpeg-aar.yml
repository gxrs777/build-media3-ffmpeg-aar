name: build-media3-ffmpeg-aar

on:
  workflow_dispatch:
  push:
    tags:
      - 'ffmpeg-*'

env:
  MEDIA3_TAG: 1.11.1
  NDK_VERSION: 25.2.9519653
  CMAKE_VERSION: 3.31.1
  JAVA_VERSION: 17
  TARGET_ABIS: "arm64-v8a,armeabi-v7a"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Media3 (tag)
        uses: actions/checkout@v4
        with:
          repository: androidx/media
          ref: ${{ env.MEDIA3_TAG }}
          fetch-depth: 1

      - name: Setup Java (JDK 17 必须，否则 sdkmanager 会崩溃)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4 # 升级到 v4
        with:
          # 覆盖默认包，去掉已废弃的 'tools'，只装 platform-tools
          packages: 'platform-tools'

      - name: Accept Android licenses (手动接受许可证防卡死)
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install NDK + CMake
        run: |
          sdkmanager --install "ndk;${{ env.NDK_VERSION }}" "cmake;${{ env.CMAKE_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "NDK_PATH=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Configure FFmpeg decoders / parsers / demuxer
        working-directory: libraries/decoder_ffmpeg/src/main/jni
        run: |
          # 追加需要的音视频解码器和协议
          cat >> ffmpeg_command.txt <<'EOF'
          --enable-decoder=aac,aac_latm,mp2,mp3,ac3,eac3,flac,opus,pcm_s16le,pcm_alaw,pcm_mulaw
          --enable-parser=aac,ac3,mpegaudio
          --enable-demuxer=mpegts
          --enable-protocol=file,tcp,udp,rtp,http,https
          EOF

      - name: Grant gradle exec
        run: chmod +x gradlew

      - name: Build media3-decoder-ffmpeg AAR
        run: |
          ./gradlew :media3-decoder-ffmpeg:assembleRelease \
            -Pandroid.injected.build.abi=${{ env.TARGET_ABIS }} \
            --no-daemon

      - name: Rename and Upload AAR
        run: |
          SRC="libraries/decoder_ffmpeg/build/outputs/aar/media3-decoder-ffmpeg-release.aar"
          DST="media3-decoder-ffmpeg-${{ env.MEDIA3_TAG }}.aar"
          cp "$SRC" "$DST"
          echo "AAR=$DST" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: media3-ffmpeg-aar
          path: ${{ env.AAR }}
